name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest
      - name: CLI smoke test
        run: |
          d=$(mktemp -d)
          RAPPORT_CONFIG=/dev/null bin/rapport init "$d/r" --title "Smoke"
          RAPPORT_CONFIG=/dev/null bin/rapport build "$d/r"
          test -s "$d/r/report.html"
