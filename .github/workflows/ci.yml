name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.3 check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest
      - name: Install and run as a new user would
        run: |
          rm -rf .venv
          export HOME="$(mktemp -d)"
          export PATH="$HOME/.local/bin:$PATH"
          ./install.sh --bin
          d=$(mktemp -d)
          rapport init "$d/r" --title "Smoke"
          rapport build "$d/r"
          test -s "$d/r/report.html"
