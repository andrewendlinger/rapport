# The default preset: nothing beyond the built-in defaults.
#
# A preset is a named bundle of settings, selected with `preset = "<name>"`
# in any config layer and applied just above the defaults (so user, project
# and front-matter settings still win). Add your own as <name>.toml in the
# user presets folder (`rapport config paths` shows it) or a rapport-presets/
# folder next to a rapport.toml.
