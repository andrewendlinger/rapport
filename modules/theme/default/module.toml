name = "default"
kind = "theme"
summary = "Minimal: white ground, system sans throughout, one blue accent; light and dark."

# Every token becomes a CSS custom property --rp-<name>. Modules style
# themselves with these only, so a theme swap restyles everything.
# Override any of them from config: [theme.tokens] / [theme.tokens.dark].
[tokens]
bg = "#FFFFFF"
surface = "#FAFAFA"
surface-2 = "#F4F4F5"
ink = "#18181B"
ink-soft = "#52525B"
ink-faint = "#8A8A93"
line = "#E4E4E7"
accent = "#2563EB"
accent-soft = "#EFF6FF"
ok = "#1A7A4A"
ok-soft = "#F0FDF4"
warn = "#91580A"
warn-soft = "#FFFBEB"
danger = "#A33B2E"
danger-soft = "#FEF2F2"
violet = "#6D28D9"
violet-soft = "#F5F3FF"
shadow = "0 4px 10px rgba(26,33,41,.06), 0 18px 44px -16px rgba(26,33,41,.22)"
sans = 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
serif = 'Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif'
mono = 'ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace'
body-font = "var(--rp-sans)"
heading-font = "var(--rp-sans)"
body-size = "16px"
radius = "8px"
width = "70ch"

[tokens.dark]
bg = "#0A0A0B"
surface = "#131315"
surface-2 = "#1A1A1D"
ink = "#EDEDEF"
ink-soft = "#A1A1AA"
ink-faint = "#71717A"
line = "#26262A"
accent = "#60A5FA"
accent-soft = "#172036"
ok = "#63C08F"
ok-soft = "#17291F"
warn = "#D9A03F"
warn-soft = "#32291A"
danger = "#DB8273"
danger-soft = "#33201D"
violet = "#B79CEC"
violet-soft = "#2A2142"
shadow = "0 4px 10px rgba(0,0,0,.35), 0 18px 44px -16px rgba(0,0,0,.55)"
