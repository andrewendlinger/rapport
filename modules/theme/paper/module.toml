name = "paper"
kind = "theme"
summary = "Warm paper, serif throughout, a little more air; light and dark."

[tokens]
bg = "#F4EFE6"
surface = "#FBF8F2"
surface-2 = "#F0EADF"
ink = "#2B2620"
ink-soft = "#655C50"
ink-faint = "#9A9082"
line = "#DDD4C4"
