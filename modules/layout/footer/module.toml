name = "footer"
kind = "layout"
summary = "Quiet closing line: title, version, build date; optional logo and entries with icons."

[feedback]
unit = "none"

[config.text]
type = "string"
default = ""
doc = "Extra footer text (e.g. a confidentiality note)."

[config.show_title]
type = "bool"
default = true
doc = "Show the report title."

[config.show_version]
type = "bool"
default = true
doc = "Show the report version."

[config.show_date]
type = "bool"
default = true
doc = "Show the build date."

[config.logo]
type = "string"
default = ""
path = true
doc = "Logo image at the start of the footer (svg, png, jpg, gif, webp, avif), relative to the config file that sets it; inlined into the page."

[config.logo_dark]
type = "string"
default = ""
path = true
doc = "Logo for dark mode, e.g. a light-on-transparent version. Empty: `logo` in both modes."

[config.logo_alt]
type = "string"
default = ""
doc = "Alt text for the logo, e.g. the organisation's name. Empty: the logo is decorative."

[config.logo_height]
type = "number"
default = 20
doc = "Logo height in px at the default 17px text size; it scales with body-size."

[config.logo_align]
type = "enum"
choices = ["left", "right"]
default = "left"
doc = "left: before the footer's text; right: at the far end of the line."

[config.entries]
type = "tables"
merge = "by-id"
default = []
doc = "Extra footer entries after the text, e.g. {icon = \"🔒\", text = \"Confidential\"}. Fields: icon, text, href, label, tint, id, enabled. Entries add up across config layers; one with an id can be changed or switched off (enabled = false) by a nearer layer."

[config.entries.fields.id]
type = "string"
doc = "Optional; lets a nearer config layer change or switch off (enabled = false) this entry."

[config.entries.fields.icon]
type = "string"
path = "icon"
doc = "An emoji or any symbol, or an image file (svg, png, jpg, gif, webp, avif) relative to the config file that sets it."

[config.entries.fields.text]
type = "string"
doc = "Text after the icon."

[config.entries.fields.href]
type = "string"
doc = "Makes the entry a link (https:, mailto:, a relative path or #anchor)."

[config.entries.fields.label]
type = "string"
doc = "Tooltip; for an entry without text, also what screen readers announce."

[config.entries.fields.tint]
type = "bool"
doc = "Image icons: true draws the image in the text colour (a one-colour icon then follows light and dark mode), false keeps its colours. Unset: tinted only if it's an SVG that uses currentColor."

[config.entries.fields.enabled]
type = "bool"
doc = "false removes the entry."
